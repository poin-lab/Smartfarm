volumes:
  orderer.smartfarm.com:
  peer0.org1.smartfarm.com:
  couchdb-smartfarm:

networks:
  bio:                     # 👈 내부에서 부르는 이름 변경 (test -> bio)
    name: fabric_bio       # 👈 실제 도커 네트워크 이름 변경

services:
  # -----------------------------------------------------------
  # 1. CouchDB (데이터베이스) - 추가됨
  # -----------------------------------------------------------
  couchdb-smartfarm:
    container_name: couchdb-smartfarm
    restart: unless-stopped
    image: couchdb:3.1.1
    labels:
      service: hyperledger-fabric
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    networks:
      - bio
    volumes:
      - couchdb-smartfarm:/opt/couchdb/data

  # -----------------------------------------------------------
  # 1. Orderer (orderer.smartfarm.com)
  # -----------------------------------------------------------
  orderer.smartfarm.com:
    container_name: orderer.smartfarm.com
    image: hyperledger/fabric-orderer:latest
    restart: unless-stopped
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      # TLS 설정
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=orderer.smartfarm.com:9443
      - ORDERER_METRICS_PROVIDER=prometheus
    working_dir: /root
    command: orderer
    volumes:
      - ../channel_artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ../organizations/ordererOrganizations/smartfarm.com/orderers/orderer.smartfarm.com/msp:/var/hyperledger/orderer/msp

      # TLS 경로는 변수가 없으므로 NETWORK_BASE 기준 절대 경로 생성
      - ../organizations/ordererOrganizations/smartfarm.com/orderers/orderer.smartfarm.com/tls/:/var/hyperledger/orderer/tls

      # 도커 볼륨 (데이터 지속성)
      - orderer.smartfarm.com:/var/hyperledger/production/orderer
    ports:
      - 7050:7050
      - 7053:7053
      - 9443:9443
    networks:
      - bio                # 👈 여기도 bio로 변경됨

  # -----------------------------------------------------------
  # 2. Peer (peer0.org1.smartfarm.com)
  # -----------------------------------------------------------
  peer0.org1.smartfarm.com:
    container_name: peer0.org1.smartfarm.com
    image: hyperledger/fabric-peer:latest
    restart: unless-stopped
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org1.smartfarm.com
      - CORE_PEER_ADDRESS=peer0.org1.smartfarm.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.smartfarm.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.smartfarm.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.smartfarm.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org1.smartfarm.com:9444
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0org1"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_bio   # 👈 도커 네트워크 이름 변경 (test -> bio)

  # 👇 [여기 추가됨] CouchDB 연결 설정
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb-smartfarm:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw

    volumes:
      - ../config:/etc/hyperledger/fabric
      - ../organizations/peerOrganizations/org1.smartfarm.com/peers/peer0.org1.smartfarm.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org1.smartfarm.com/peers/peer0.org1.smartfarm.com/tls:/etc/hyperledger/fabric/tls
      - peer0.org1.smartfarm.com:/var/hyperledger/production
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /root
    command: peer node start
    ports:
      - 7051:7051
      - 9444:9444
    depends_on: # db켜져야 피어가 켜짐
      - couchdb-smartfarm          # 👈 CouchDB에 의존성 추가
    networks:
      - bio                # 👈 여기도 bio로 변경됨

  # -----------------------------------------------------------
  # 4. CLI (관리자 도구)
  # -----------------------------------------------------------
  cli-smartfarm:
    container_name: cli-smartfarm
    image: hyperledger/fabric-tools:latest
    labels:
      service: hyperledger-fabric
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock

      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_CA=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/ordererOrganizations/smartfarm.com/orderers/orderer.smartfarm.com/msp/tlscacerts/tlsca.smartfarm.com-cert.pem
      - ORDERER_ADMIN_TLS_SIGN_CERT=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/ordererOrganizations/smartfarm.com/orderers/orderer.smartfarm.com/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATE_KEY=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/ordererOrganizations/smartfarm.com/orderers/orderer.smartfarm.com/tls/server.key

      - CORE_PEER_ID=cli-smartfarm
      - CORE_PEER_ADDRESS=peer0.org1.smartfarm.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true

      - CORE_PEER_TLS_CERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.smartfarm.com/peers/peer0.org1.smartfarm.com/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.smartfarm.com/peers/peer0.org1.smartfarm.com/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.smartfarm.com/peers/peer0.org1.smartfarm.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations/peerOrganizations/org1.smartfarm.com/users/Admin@org1.smartfarm.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    volumes:
      - /var/run/:/host/var/run/
      # 👇 여기도 절대 경로 적용
      - ..:/opt/gopath/src/github.com/hyperledger/fabric/peer/

    networks:
      - bio
    depends_on:
      - orderer.smartfarm.com
      - peer0.org1.smartfarm.com
